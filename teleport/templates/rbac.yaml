{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "teleport.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "teleport.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.rbac.create .Values.kubernetesAccess.enabled }}
---
{{/*
Kubernetes access works by impersonation: Teleport authenticates to the
API server as itself, then acts as the Kubernetes user and groups mapped
from the Teleport role. These verbs are what that requires — nothing here
grants Teleport direct access to workloads or secrets. What a user can
actually do is still decided by that user's own Kubernetes RBAC.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "teleport.fullname" . }}
  labels:
    {{- include "teleport.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["users", "groups", "serviceaccounts"]
    verbs: ["impersonate"]
  # Resolves the pod behind an exec/attach session for the audit log.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  # Lets Teleport tell a user what they are allowed to do before it
  # forwards a request, so denials surface as a clear error.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews", "selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "teleport.fullname" . }}
  labels:
    {{- include "teleport.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "teleport.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "teleport.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

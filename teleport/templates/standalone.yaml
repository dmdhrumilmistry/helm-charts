{{- if ne (include "teleport.isHA" .) "true" }}
{{- $fullName := include "teleport.fullname" . -}}
{{- $labels := include "teleport.componentLabels" (dict "root" . "component" "standalone") -}}
{{- $selector := include "teleport.componentSelectorLabels" (dict "root" . "component" "standalone") -}}
{{- $separate := eq .Values.proxy.listenerMode "separate" -}}
{{- if and (not .Values.persistence.enabled) (not .Values.persistence.existingClaim) -}}
{{- fail "persistence.enabled must be true in standalone mode: the SQLite backend holds the cluster's certificate authorities, and losing it invalidates every certificate Teleport has issued." -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  serviceName: {{ $fullName }}
  # Auth and Proxy share one SQLite file on a ReadWriteOnce volume, so
  # the old pod must be gone before the new one starts.
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $selector | nindent 8 }}
        {{- with .Values.proxy.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include "teleport.config.standalone" . | sha256sum }}
        {{- with .Values.proxy.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "teleport.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "teleport.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.proxy.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: teleport
          image: {{ include "teleport.image" (dict "root" . "image" .Values.image "defaultTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No args: the image entrypoint is already
          #   dumb-init teleport start -c /etc/teleport/teleport.yaml
          # and anything passed here is appended to it, not substituted.
          ports:
            - name: web
              containerPort: 3080
              protocol: TCP
            - name: auth
              containerPort: 3025
              protocol: TCP
            - name: diag
              containerPort: {{ .Values.diagPort }}
              protocol: TCP
            {{- if $separate }}
            - name: ssh
              containerPort: 3023
              protocol: TCP
            - name: tunnel
              containerPort: 3024
              protocol: TCP
            - name: kube
              containerPort: 3026
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: diag
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: diag
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /healthz
              port: diag
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: config
              mountPath: /etc/teleport
              readOnly: true
            - name: data
              mountPath: {{ .Values.dataDir }}
            {{- if .Values.tls.existingSecret }}
            - name: tls
              mountPath: /etc/teleport-tls
              readOnly: true
            {{- end }}
            # readOnlyRootFilesystem is on, and Teleport still needs
            # somewhere to write scratch files.
            - name: tmp
              mountPath: /tmp
          {{- with .Values.proxy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          secret:
            secretName: {{ $fullName }}-config
        - name: tmp
          emptyDir: {}
        {{- if .Values.tls.existingSecret }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret }}
        {{- end }}
        {{- if .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- end }}
      {{- with .Values.proxy.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.proxy.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.proxy.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if not .Values.persistence.existingClaim }}
  volumeClaimTemplates:
    - metadata:
        name: data
        # Selector labels only. volumeClaimTemplates are immutable, so a
        # version-bearing label like helm.sh/chart would make every chart
        # version bump an un-upgradable StatefulSet.
        labels:
          {{- include "teleport.componentSelectorLabels" (dict "root" . "component" "standalone") | nindent 10 }}
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
  {{- with .Values.proxy.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.proxy.service.type }}
  {{- with .Values.proxy.service.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  {{- with .Values.proxy.service.loadBalancerClass }}
  loadBalancerClass: {{ . | quote }}
  {{- end }}
  {{- if and (eq .Values.proxy.service.type "LoadBalancer") .Values.proxy.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.proxy.service.externalTrafficPolicy }}
  {{- end }}
  ports:
    - name: web
      port: {{ .Values.proxy.service.port }}
      targetPort: web
      protocol: TCP
      {{- with (index .Values.proxy.service.nodePorts "web") }}
      nodePort: {{ . }}
      {{- end }}
    {{- if $separate }}
    - name: ssh
      port: 3023
      targetPort: ssh
      protocol: TCP
    - name: tunnel
      port: 3024
      targetPort: tunnel
      protocol: TCP
    - name: kube
      port: 3026
      targetPort: kube
      protocol: TCP
    {{- end }}
  selector:
    {{- $selector | nindent 4 }}
{{- end }}

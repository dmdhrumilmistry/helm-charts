{{- if and (eq (include "teleport.isHA" .) "true") (eq (include "teleport.agentsEnabled" .) "true") }}
{{- $fullName := include "teleport.agent.fullname" . -}}
{{- $labels := include "teleport.componentLabels" (dict "root" . "component" "agent") -}}
{{- $selector := include "teleport.componentSelectorLabels" (dict "root" . "component" "agent") -}}
{{/*
In ha mode the agent services run on their own rather than inside the
control plane, so Kubernetes, application and database access scale and
restart independently of Auth and Proxy.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  replicas: {{ .Values.agent.replicaCount }}
  selector:
    matchLabels:
      {{- $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $selector | nindent 8 }}
        {{- with .Values.agent.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include "teleport.config.agent" . | sha256sum }}
        {{- with .Values.agent.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "teleport.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "teleport.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: teleport
          image: {{ include "teleport.image" (dict "root" . "image" .Values.image "defaultTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No args: the image entrypoint is already
          #   dumb-init teleport start -c /etc/teleport/teleport.yaml
          # and anything passed here is appended to it, not substituted.
          ports:
            - name: diag
              containerPort: {{ .Values.diagPort }}
              protocol: TCP
          livenessProbe:
            httpGet: { path: /healthz, port: diag }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /readyz, port: diag }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/teleport
              readOnly: true
            - name: join-token
              mountPath: /etc/teleport-join
              readOnly: true
            # Holds the agent's own identity once it has joined, so a
            # restart does not consume the join token again.
            - name: data
              mountPath: {{ .Values.dataDir }}
            - name: tmp
              mountPath: /tmp
          {{- with .Values.agent.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          secret:
            secretName: {{ $fullName }}-config
        - name: join-token
          secret:
            secretName: {{ include "teleport.secretName" . }}
            items:
              - key: joinToken
                path: token
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

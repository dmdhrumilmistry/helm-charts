apiVersion: v2
name: nandi
description: Gateway and runtime monitor for AI agents. Records every LLM, MCP and A2A call, applies policy before it runs, holds risky actions for approval, and serves the operator dashboard and admin API.
type: application

# Chart version. Bump on every change to the chart or its templates.
version: 0.1.0

# Version of nandi this chart deploys by default.
appVersion: "0.1.0"

icon: https://raw.githubusercontent.com/dmdhrumilmistry/nandi/main/website/assets/mark.svg

home: https://dmdhrumilmistry.github.io/nandi/
sources:
  - https://github.com/dmdhrumilmistry/nandi
  - https://github.com/dmdhrumilmistry/helm-charts

keywords:
  - ai-agents
  - llm
  - mcp
  - a2a
  - security
  - zero-trust
  - policy
  - prompt-injection
  - audit-log
  - gateway

maintainers:
  - name: Dhrumil Mistry
    url: https://github.com/dmdhrumilmistry

annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: nandi
      image: docker.io/dmdhrumilmistry/nandi:0.1.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://dmdhrumilmistry.github.io/nandi/docs/
    - name: nandi source (Apache-2.0)
      url: https://github.com/dmdhrumilmistry/nandi
  artifacthub.io/changes: |
    - kind: added
      description: Initial release. No required values; the admin token is generated on install and preserved on upgrade.
    - kind: added
      description: Separate Services for agent traffic (proxy) and operators (dashboard and admin API), each with an optional Ingress tuned for streaming.
    - kind: added
      description: nandi.yaml and policies from values, with the listen addresses, data directory and admin token set by the chart. Pods roll when they change.
    - kind: added
      description: Audit log and learned state on a persistent volume; rootless, read-only root filesystem, all capabilities dropped; NetworkPolicy and ServiceMonitor.

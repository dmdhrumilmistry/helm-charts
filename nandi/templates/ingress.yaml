{{- range $kind := list "admin" "proxy" }}
{{- $ing := index $.Values.ingress $kind }}
{{- if $ing.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s-%s" (include "nandi.fullname" $) $kind | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "nandi.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $kind }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required (printf "ingress.%s.host is required when ingress.%s.enabled" $kind $kind) $ing.host | quote }}
      http:
        paths:
          - path: {{ $ing.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ if eq $kind "admin" }}{{ include "nandi.adminServiceName" $ }}{{ else }}{{ include "nandi.proxyServiceName" $ }}{{ end }}
                port:
                  name: {{ $kind }}
{{- end }}
{{- end }}

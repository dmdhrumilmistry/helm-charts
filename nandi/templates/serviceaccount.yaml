{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nandi.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nandi.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# nandi does not talk to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}

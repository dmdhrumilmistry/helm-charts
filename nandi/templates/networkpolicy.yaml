{{- if .Values.networkPolicy.enabled }}
{{/*
Admits the proxy port to agents and the admin port to operators (the
ingress controller and Prometheus by default), each optionally only from
the peers you list. Egress is left open: upstream LLM APIs, MCP servers
and webhooks are destinations the chart cannot know.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nandi.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nandi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nandi.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: proxy
          protocol: TCP
      {{- with .Values.networkPolicy.proxy.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - port: admin
          protocol: TCP
      from:
        # Pods in the release namespace (helm test, kubectl port-forward
        # goes through the kubelet and is not affected).
        - podSelector: {}
        {{- with .Values.networkPolicy.admin.from }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}

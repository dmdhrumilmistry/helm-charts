apiVersion: v1
kind: Pod
metadata:
  name: {{ include "nandi.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nandi.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: healthz
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          set -e
          wget -qO- http://{{ include "nandi.adminServiceName" . }}:{{ .Values.service.admin.port }}/healthz
          echo
          # The proxy answers unknown paths with a JSON 404, which proves it is up.
          wget -qO- http://{{ include "nandi.proxyServiceName" . }}:{{ .Values.service.proxy.port }}/nandi-helm-test 2>&1 | grep -q "404" && echo "proxy reachable"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]

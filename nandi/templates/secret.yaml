{{- if not .Values.admin.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nandi.adminSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nandi.labels" . | nindent 4 }}
  annotations:
    # Keep the token if the release is uninstalled and reinstalled.
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ include "nandi.adminToken" . | b64enc | quote }}
{{- end }}
{{- if .Values.secretEnv }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nandi.envSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nandi.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k, $v := .Values.secretEnv }}
  {{ $k }}: {{ $v | toString | b64enc | quote }}
  {{- end }}
{{- end }}

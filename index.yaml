apiVersion: v1
entries:
  netbird:
  - annotations:
      artifacthub.io/changes: |
        - kind: fixed
          description: Correct the object names in the README's troubleshooting and backup commands. They carried a doubled netbird- prefix that does not match what the chart renders.
        - kind: changed
          description: Rewritten around the combined netbirdio/netbird-server image (management + signal + relay + STUN in one workload).
        - kind: added
          description: Built-in local user management (embedded Dex IdP). No external OIDC provider required to install.
        - kind: added
          description: In-cluster PostgreSQL StatefulSet, enabled by default, with support for an external database.
        - kind: added
          description: Autoscaling (HPA), PodDisruptionBudgets, topology spread, resources and cloud presets for AWS EKS and GKE.
        - kind: removed
          description: Coturn, Adminer and the separate management/signal/relay Deployments. Their functionality now lives in netbird-server.
      artifacthub.io/license: MIT

  teleport:
  - annotations:
      artifacthub.io/changes: |
        - kind: added
          description: Initial release. Teleport Community Edition with standalone and HA modes.
        - kind: added
          description: Standalone mode runs Auth and Proxy in one process on an SQLite backend.
        - kind: added
          description: HA mode splits Auth and Proxy across replicas on a PostgreSQL backend.
        - kind: added
          description: Kubernetes, application and database access, with the RBAC Kubernetes access requires.
      artifacthub.io/containsSecurityUpdates: "false"
      artifacthub.io/images: |

  vishwakarma:
  - annotations:
      artifacthub.io/changes: |
        - kind: fixed
          description: macOS on Linux uses a 3 GB guest so it fits its 4.5 GiB memory limit under software emulation (it was OOM-killed).
        - kind: changed
          description: macOS on Linux keeps the installed system on a persistent 50 GiB volume, so it survives stop, start and restarts.
        - kind: fixed
          description: macOS on Linux boots under software emulation (no AVX/AES-NI offered to the guest, which made corecrypto panic).
        - kind: added
          description: Google Play images published and enabled by default, plus an unrooted variant (no su, production build).
        - kind: fixed
          description: macOS on Linux no longer waits forever for /dev/kvm (software emulation fallback), uses the current Docker-OSX image, and reserves its memory in full.
        - kind: added
          description: Screen tab in the console (noVNC) for Android, KubeVirt VMs and macOS VMs.
        - kind: added
          description: Android sandboxes stream their screen to the browser by default through a scrcpy sidecar.
        - kind: added
          description: Opt-in macOS on Linux template (Docker-OSX, needs /dev/kvm), sandboxes.macosOnLinux.
        - kind: added
          description: Android 12 with Play Store template for a self-built image, sandboxes.androidPlayStoreImage.
        - kind: fixed
          description: Copy and paste in the console over plain HTTP (copy buttons, terminal, Android screen).
      artifacthub.io/images: |
        - name: vishwakarma
          image: docker.io/dmdhrumilmistry/vishwakarma:0.4.3
        - name: android-screen
          image: docker.io/dmdhrumilmistry/vishwakarma-android-screen:0.4.3
        - name: redroid-playstore
          image: docker.io/dmdhrumilmistry/vishwakarma-redroid-playstore:12
        - name: redroid-playstore-unrooted
          image: docker.io/dmdhrumilmistry/vishwakarma-redroid-playstore:12-unrooted
      artifacthub.io/license: MIT
      artifacthub.io/links: |
        - name: Vishwakarma source (Apache-2.0)
          url: https://github.com/dmdhrumilmistry/vishwakarma

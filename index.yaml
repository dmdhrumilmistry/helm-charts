  wazuh:
  - annotations:
      artifacthub.io/changes: |
        - kind: fixed
          description: Traefik ingress now verifies the dashboard certificate via a ServersTransport pinning serverName and the chart CA. Without it Traefik dialled pod IPs, failed verification and returned 500 on every request.
        - kind: fixed
          description: The ingress only claims a TLS secret that something will actually create, instead of naming one that never exists and erroring on every reconcile.
        - kind: added
          description: Initial release. Wazuh indexer, manager and dashboard.
        - kind: added
          description: Internal PKI generated at install time and preserved across upgrades, replacing the cert-generation script upstream requires you to run by hand.
        - kind: added
          description: Credentials generated once and reused on upgrade, including the bcrypt hashes the indexer needs.
      artifacthub.io/images: |
        - name: wazuh-manager
          image: wazuh/wazuh-manager:4.14.7
        - name: wazuh-indexer
          image: wazuh/wazuh-indexer:4.14.7
        - name: wazuh-dashboard
          image: wazuh/wazuh-dashboard:4.14.7
      artifacthub.io/license: MIT
      artifacthub.io/links: |
        - name: Wazuh source (GPL-2.0)
          url: https://github.com/wazuh/wazuh
        - name: Wazuh documentation
          url: https://documentation.wazuh.com/

{{- if and .Values.manifests.files (not .Values.manifests.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vs.fullname" . }}-manifests
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vs.labels" . | nindent 4 }}
data:
  {{- range $name, $content := .Values.manifests.files }}
  {{- if not (regexMatch "^[a-zA-Z0-9._-]+\\.(ya?ml|json)$" $name) }}
  {{- fail (printf "manifests.files key %q must be a file name ending in .yaml, .yml or .json" $name) }}
  {{- end }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vs.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vs.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "vs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vs.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "vs.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.ingress.enabled }}
---
# Only the ingress controller may reach the server. This matters when client
# certificates arrive in a header: a client that bypassed the ingress could
# otherwise replay a device certificate (which is public) in that header.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vs.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
          {{- with .Values.networkPolicy.ingressPodLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
        {{- if .Values.tests.enabled }}
        - podSelector:
            matchLabels:
              {{- include "vs.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: test
        {{- end }}
      ports:
        - port: http
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vs.postgresName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vs.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: database
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "vs.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: server
      ports:
        - port: postgres
{{- end }}

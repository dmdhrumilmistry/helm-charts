{{- if and .Values.ingress.enabled .Values.ingress.clientCertificates (eq (include "vs.ingressController" .) "traefik") }}
# Traefik: ask every client for a certificate without requiring or verifying
# one. Windows and Linux devices present their VaanarSena identity; browsers
# and Apple devices present none. The handshake still proves possession of
# the key, and VaanarSena verifies the chain against its own CA.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: {{ include "vs.fullname" . }}-client-certs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vs.labels" . | nindent 4 }}
spec:
  minVersion: VersionTLS12
  clientAuth:
    clientAuthType: RequestClientCert
---
# Forward the certificate in X-Forwarded-Tls-Client-Cert. The middleware
# removes any value the client sent itself, so the header can be trusted.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "vs.fullname" . }}-client-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vs.labels" . | nindent 4 }}
spec:
  passTLSClientCert:
    pem: true
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.httpRedirect (eq (include "vs.ingressController" .) "traefik") }}
---
# Plain HTTP: redirect to HTTPS. The main Ingress listens on websecure only,
# so without this a browser typing the bare host name gets Traefik's 404.
# Scoped to publicHost; other hosts on port 80 are untouched.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "vs.fullname" . }}-https-redirect
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vs.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vs.fullname" . }}-http
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vs.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-https-redirect@kubernetescrd" .Release.Namespace (include "vs.fullname" .) | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "traefik" }}
  rules:
    - host: {{ .Values.publicHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vs.fullname" . }}
                port:
                  name: http
{{- end }}

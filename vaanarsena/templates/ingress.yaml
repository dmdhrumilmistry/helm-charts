{{- if .Values.ingress.enabled }}
{{- $ctrl := include "vs.ingressController" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vs.labels" . | nindent 4 }}
  annotations:
    {{- if eq $ctrl "nginx" }}
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    {{- if .Values.ingress.clientCertificates }}
    # Request (but do not require) a device certificate issued by the
    # VaanarSena CA and forward it to the server, which binds it to a device.
    # Browsers and Apple devices send none and are unaffected.
    nginx.ingress.kubernetes.io/auth-tls-secret: {{ printf "%s/%s" .Release.Namespace (include "vs.caCertSecret" .) | quote }}
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "optional"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
    {{- end }}
    {{- else if eq $ctrl "traefik" }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- if .Values.ingress.clientCertificates }}
    # See templates/traefik.yaml: request client certificates and forward them.
    traefik.ingress.kubernetes.io/router.tls.options: {{ printf "%s-%s-client-certs@kubernetescrd" .Release.Namespace (include "vs.fullname" .) | quote }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-client-cert@kubernetescrd" .Release.Namespace (include "vs.fullname" .) | quote }}
    {{- end }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with (.Values.ingress.className | default (ternary $ctrl "" (ne $ctrl "other"))) }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts:
        - {{ required "publicHost is required" .Values.publicHost | quote }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "vs.fullname" .)) }}
  rules:
    - host: {{ .Values.publicHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vs.fullname" . }}
                port:
                  name: http
{{- end }}

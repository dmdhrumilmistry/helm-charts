{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vs.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vs.labels" . | nindent 4 }}
  annotations:
    # Losing secretKey makes the database unreadable; never let helm delete it.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  secretKey: {{ include "vs.gen" (dict "root" . "key" "secretKey") | quote }}
  adminPassword: {{ include "vs.gen" (dict "root" . "key" "adminPassword") | quote }}
  {{- if .Values.postgresql.enabled }}
  postgresPassword: {{ include "vs.gen" (dict "root" . "key" "postgresPassword") | quote }}
  {{- end }}
  {{- if or .Values.postgresql.enabled .Values.externalDatabase.url }}
  databaseUrl: {{ include "vs.databaseUrl" . | quote }}
  {{- end }}
{{- end }}
{{- if not .Values.ca.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vs.caCertSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vs.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ca.crt: {{ include "vs.gen" (dict "root" . "key" "caCert") | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vs.caKeySecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vs.labels" . | nindent 4 }}
  annotations:
    # Losing the CA orphans every enrolled device.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ca.crt: {{ include "vs.gen" (dict "root" . "key" "caCert") | quote }}
  ca.key: {{ include "vs.gen" (dict "root" . "key" "caKey") | quote }}
{{- end }}

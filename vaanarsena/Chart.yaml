apiVersion: v2
name: vaanarsena
description: Self-hosted VaanarSena - open source device management (MDM) for iOS, macOS, Windows, Android, ChromeOS and Linux, with BYOD support.
type: application

# Chart version. Bump on every change to the chart or its templates.
version: 0.6.0

# Version of VaanarSena this chart deploys by default.
appVersion: "0.5.0"

home: https://github.com/dmdhrumilmistry/VaanarSena
sources:
  - https://github.com/dmdhrumilmistry/VaanarSena
  - https://github.com/dmdhrumilmistry/helm-charts

keywords:
  - mdm
  - device-management
  - byod
  - apple-mdm
  - windows-mdm
  - android-enterprise
  - linux

maintainers:
  - name: Dhrumil Mistry
    url: https://github.com/dmdhrumilmistry

annotations:
  # The chart is MIT; VaanarSena itself is Apache-2.0.
  artifacthub.io/license: MIT
  artifacthub.io/images: |
    - name: vaanarsena
      image: docker.io/dmdhrumilmistry/vaanarsena:0.5.0
    - name: postgres
      image: postgres:17-alpine
  artifacthub.io/links: |
    - name: VaanarSena source (Apache-2.0)
      url: https://github.com/dmdhrumilmistry/VaanarSena
  artifacthub.io/changes: |
    - kind: changed
      description: The server image moves from ghcr.io to Docker Hub (docker.io/dmdhrumilmistry/vaanarsena), which anyone can pull without logging in.
    - kind: changed
      description: Deploys VaanarSena 0.5.0, with compliance webhooks for conditional access and OpenID Connect single sign-on (configure SSO through extraEnv).
    - kind: security
      description: VaanarSena 0.5.0 hardens BYOD handling when a device is reclassified as personal; its two database migrations run on start.
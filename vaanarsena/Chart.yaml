apiVersion: v2
name: vaanarsena
description: Self-hosted VaanarSena - open source device management (MDM) for iOS, macOS, Windows, Android, ChromeOS and Linux, with BYOD support.
type: application

# Chart version. Bump on every change to the chart or its templates.
version: 0.5.0

# Version of VaanarSena this chart deploys by default.
appVersion: "0.4.0"

home: https://github.com/dmdhrumilmistry/VaanarSena
sources:
  - https://github.com/dmdhrumilmistry/VaanarSena
  - https://github.com/dmdhrumilmistry/helm-charts

keywords:
  - mdm
  - device-management
  - byod
  - apple-mdm
  - windows-mdm
  - android-enterprise
  - linux

maintainers:
  - name: Dhrumil Mistry
    url: https://github.com/dmdhrumilmistry

annotations:
  # The chart is MIT; VaanarSena itself is Apache-2.0.
  artifacthub.io/license: MIT
  artifacthub.io/images: |
    - name: vaanarsena
      image: ghcr.io/dmdhrumilmistry/vaanarsena:0.4.0
    - name: postgres
      image: postgres:17-alpine
  artifacthub.io/links: |
    - name: VaanarSena source (Apache-2.0)
      url: https://github.com/dmdhrumilmistry/VaanarSena
  artifacthub.io/changes: |
    - kind: changed
      description: Deploys VaanarSena 0.4.0, with a redesigned console (light, dark and system themes) and the new emblem.
    - kind: added
      description: Software inventory from VaanarSena 0.4.0 (installed apps, services and profiles per device and across the fleet); the database migration runs on start.

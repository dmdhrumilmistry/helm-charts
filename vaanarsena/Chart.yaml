apiVersion: v2
name: vaanarsena
description: Self-hosted VaanarSena - open source device management (MDM) for iOS, macOS, Windows, Android, ChromeOS and Linux, with BYOD support.
type: application

# Chart version. Bump on every change to the chart or its templates.
version: 0.7.0

# Version of VaanarSena this chart deploys by default.
appVersion: "0.6.0"

home: https://github.com/dmdhrumilmistry/VaanarSena
sources:
  - https://github.com/dmdhrumilmistry/VaanarSena
  - https://github.com/dmdhrumilmistry/helm-charts

keywords:
  - mdm
  - device-management
  - byod
  - apple-mdm
  - windows-mdm
  - android-enterprise
  - linux

maintainers:
  - name: Dhrumil Mistry
    url: https://github.com/dmdhrumilmistry

annotations:
  # The chart is MIT; VaanarSena itself is Apache-2.0.
  artifacthub.io/license: MIT
  artifacthub.io/images: |
    - name: vaanarsena
      image: docker.io/dmdhrumilmistry/vaanarsena:0.6.0
    - name: postgres
      image: postgres:17-alpine
  artifacthub.io/links: |
    - name: VaanarSena source (Apache-2.0)
      url: https://github.com/dmdhrumilmistry/VaanarSena
  artifacthub.io/changes: |
    - kind: added
      description: auth values for single sign-on (auth.oidc.*, client secret from an existing Secret) and for turning off password sign-in except for break-glass admins (auth.passwordLogin, auth.passwordLoginAllow), with a guard against locking everyone out.
    - kind: changed
      description: Deploys VaanarSena 0.6.0.

{{- $fullName := include "adguard.fullname" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "adguard.labels" . | nindent 4 }}
spec:
  serviceName: {{ $fullName }}
  # AdGuard keeps query logs and statistics on a ReadWriteOnce volume and
  # owns a single DNS listener, so the old pod must be gone before the
  # new one starts.
  replicas: {{ .Values.replicaCount }}
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "adguard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "adguard.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "adguard.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "adguard.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      initContainers:
        {{/*
        AdGuard rewrites its own config whenever you change a setting in
        the web UI, so the file cannot be a read-only mount. It is seeded
        from the chart on first start and then left alone — meaning
        changes to values do NOT overwrite later UI edits. Delete
        conf/AdGuardHome.yaml on the volume to re-seed from values.
        */}}
        - name: seed-config
          image: {{ include "adguard.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              if [ -f /opt/adguardhome/conf/AdGuardHome.yaml ]; then
                echo "config already present, leaving it alone"
              else
                echo "seeding AdGuardHome.yaml from the chart"
                cp /bootstrap/AdGuardHome.yaml /opt/adguardhome/conf/AdGuardHome.yaml
                chmod 0600 /opt/adguardhome/conf/AdGuardHome.yaml
              fi
          volumeMounts:
            # Mounted as subdirectories, not over /opt/adguardhome: the
            # AdGuard binary itself sits at /opt/adguardhome/AdGuardHome
            # and a volume over that directory hides it.
            - name: data
              mountPath: /opt/adguardhome/conf
              subPath: conf
            - name: data
              mountPath: /opt/adguardhome/work
              subPath: work
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: adguard-home
          image: {{ include "adguard.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --no-check-update
            - -c
            - /opt/adguardhome/conf/AdGuardHome.yaml
            - -w
            - /opt/adguardhome/work
          ports:
            - name: dns-udp
              containerPort: {{ .Values.dns.port }}
              protocol: UDP
            - name: dns-tcp
              containerPort: {{ .Values.dns.port }}
              protocol: TCP
            - name: http
              containerPort: {{ .Values.web.port }}
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /opt/adguardhome/conf
              subPath: conf
            - name: data
              mountPath: /opt/adguardhome/work
              subPath: work
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: bootstrap
          secret:
            secretName: {{ $fullName }}-config
        {{- if .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        # Selector labels only. volumeClaimTemplates are immutable, so a
        # version-bearing label like helm.sh/chart would make every chart
        # version bump an un-upgradable StatefulSet.
        labels:
          {{- include "adguard.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}

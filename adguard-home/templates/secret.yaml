{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "adguard.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "adguard.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.auth.username | quote }}
  password: {{ include "adguard.gen" (dict "root" . "key" "password") | quote }}
  # The bcrypt form AdGuard stores. Kept so it is not recomputed on every
  # render, which would restart the pod on every upgrade.
  passwordHash: {{ include "adguard.gen" (dict "root" . "key" "passwordHash") | quote }}
{{- end }}

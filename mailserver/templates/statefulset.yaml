{{- $fullName := include "mailserver.fullname" . -}}
{{- $sec := .Values.security -}}
{{- $env := dict
      "OVERRIDE_HOSTNAME" (include "mailserver.hostname" .)
      "POSTMASTER_ADDRESS" (include "mailserver.postmaster" .)
      "ACCOUNT_PROVISIONER" "FILE"
      "TZ" .Values.timezone
      "LOG_LEVEL" .Values.logLevel
      "PERMIT_DOCKER" "none"
      "ENABLE_UPDATE_CHECK" "0"
      "SSL_TYPE" "manual"
      "SSL_CERT_PATH" "/etc/dms-tls/tls.crt"
      "SSL_KEY_PATH" "/etc/dms-tls/tls.key"
      "TLS_LEVEL" .Values.tls.level
      "POSTFIX_INET_PROTOCOLS" .Values.network.inetProtocols
      "DOVECOT_INET_PROTOCOLS" .Values.network.inetProtocols
      "POSTFIX_MESSAGE_SIZE_LIMIT" (toString (int .Values.postfix.messageSizeLimit))
      "ENABLE_IMAP" "1"
      "ENABLE_POP3" (ternary "1" "0" (.Values.ports.pop3s | default false))
      "ENABLE_MANAGESIEVE" (ternary "1" "0" (.Values.ports.managesieve | default false))
      "ENABLE_RSPAMD" (ternary "1" "0" $sec.rspamd.enabled)
      "ENABLE_RSPAMD_REDIS" (ternary "1" "0" $sec.rspamd.enabled)
      "RSPAMD_GREYLISTING" (ternary "1" "0" $sec.rspamd.greylisting)
      "RSPAMD_LEARN" (ternary "1" "0" $sec.rspamd.learn)
      "RSPAMD_CHECK_AUTHENTICATED" (ternary "1" "0" $sec.rspamd.checkAuthenticated)
      "MOVE_SPAM_TO_JUNK" "1"
      "ENABLE_OPENDKIM" "0"
      "ENABLE_OPENDMARC" "0"
      "ENABLE_POLICYD_SPF" "0"
      "ENABLE_AMAVIS" "0"
      "ENABLE_SPAMASSASSIN" "0"
      "ENABLE_CLAMAV" (ternary "1" "0" $sec.clamav.enabled)
      "ENABLE_FAIL2BAN" (ternary "1" "0" $sec.fail2ban.enabled)
      "FAIL2BAN_BLOCKTYPE" $sec.fail2ban.blockType
      "POSTSCREEN_ACTION" $sec.postscreenAction
      "ENABLE_DNSBL" (ternary "1" "0" $sec.dnsbl)
      "SPOOF_PROTECTION" (ternary "1" "0" $sec.spoofProtection)
      "ENABLE_MTA_STS" (ternary "1" "0" $sec.outboundMtaSts)
-}}
{{- if .Values.network.hostNetwork -}}
{{- $_ := set $env "NETWORK_INTERFACE" .Values.network.hostInterface -}}
{{- end -}}
{{- $env = mergeOverwrite $env (.Values.extraEnv | default dict) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mailserver.labels" . | nindent 4 }}
spec:
  serviceName: {{ $fullName }}
  # One replica, always. The mail queue, mailboxes and Rspamd's state sit
  # on a ReadWriteOnce volume, and two Postfix instances on one queue
  # corrupt it.
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "mailserver.serverSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mailserver.serverSelectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "mailserver.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "mailserver.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- if .Values.network.hostNetwork }}
      hostNetwork: true
      {{- end }}
      {{- if .Values.dnsPolicy }}
      dnsPolicy: {{ .Values.dnsPolicy }}
      {{- else if .Values.network.hostNetwork }}
      # Without this a host-network pod resolves through the node's
      # resolv.conf and cannot reach cluster services.
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      # supervisord stops each service in turn, and Rspamd's Redis
      # writes its snapshot on the way out. 30s can cut that short.
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: init-config
          image: {{ include "mailserver.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "/chart/config/init.sh"]
          volumeMounts:
            - name: dms-config
              mountPath: /tmp/docker-mailserver
            - name: chart-config
              mountPath: /chart/config
              readOnly: true
            - name: accounts
              mountPath: /chart/accounts
              readOnly: true
            {{- if $sec.rspamd.enabled }}
            - name: dkim
              mountPath: /chart/dkim
              readOnly: true
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              # To hand the DKIM key to the Rspamd user.
              add: [CHOWN]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      containers:
        - name: mailserver
          image: {{ include "mailserver.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- range $k, $v := $env }}
            - name: {{ $k }}
              value: {{ $v | toString | quote }}
            {{- end }}
          ports:
            - name: smtp
              containerPort: 25
              protocol: TCP
            - name: submissions
              containerPort: 465
              protocol: TCP
            - name: submission
              containerPort: 587
              protocol: TCP
            - name: imap
              containerPort: 143
              protocol: TCP
            - name: imaps
              containerPort: 993
              protocol: TCP
            {{- if .Values.ports.pop3s }}
            - name: pop3s
              containerPort: 995
              protocol: TCP
            {{- end }}
            {{- if .Values.ports.managesieve }}
            - name: managesieve
              containerPort: 4190
              protocol: TCP
            {{- end }}
          # docker-mailserver's own check: every supervised service it
          # enabled (Postfix, Dovecot, Rspamd, Fail2ban, ...) is
          # RUNNING. ClamAV, if enabled, loads its signatures on first
          # start, which can take minutes on a slow volume.
          startupProbe:
            exec:
              command: ["dms-healthcheck"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["dms-healthcheck"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          readinessProbe:
            tcpSocket:
              port: smtp
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: dms-config
              mountPath: /tmp/docker-mailserver
            # Mounted as a directory, never with subPath: a Secret
            # volume then updates in place on renewal, and
            # docker-mailserver's change detector reloads the new
            # certificate without a restart.
            - name: tls
              mountPath: /etc/dms-tls
              readOnly: true
            - name: data
              mountPath: /var/mail
              subPath: mail-data
            - name: data
              mountPath: /var/mail-state
              subPath: mail-state
            - name: data
              mountPath: /var/log/mail
              subPath: mail-logs
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            # docker-mailserver runs as root and drops to per-service
            # users itself. allowPrivilegeEscalation is required for
            # Postfix's setgid postdrop.
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            privileged: false
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
                - KILL
                - SYS_CHROOT
                - NET_BIND_SERVICE
                {{- if $sec.fail2ban.enabled }}
                # Fail2ban writes nftables rules. Inside the pod's own
                # network namespace unless hostNetwork is on.
                - NET_ADMIN
                - NET_RAW
                {{- end }}
      volumes:
        - name: dms-config
          emptyDir: {}
        - name: chart-config
          configMap:
            name: {{ $fullName }}-config
        - name: accounts
          secret:
            secretName: {{ include "mailserver.accountsSecretName" . }}
            defaultMode: 0400
        {{- if $sec.rspamd.enabled }}
        - name: dkim
          secret:
            secretName: {{ include "mailserver.dkimSecretName" . }}
            defaultMode: 0400
        {{- end }}
        - name: tls
          secret:
            secretName: {{ include "mailserver.tlsSecretName" . }}
            defaultMode: 0400
        {{- if .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        # Selector labels only. volumeClaimTemplates are immutable, so a
        # version-bearing label like helm.sh/chart would make every chart
        # version bump an un-upgradable StatefulSet.
        labels:
          {{- include "mailserver.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}

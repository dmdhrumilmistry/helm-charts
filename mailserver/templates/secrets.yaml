{{- include "mailserver.generatedSecrets" . -}}
{{- $gen := .Values._msGenerated -}}
{{- if not .Values.existingAccountsSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mailserver.accountsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mailserver.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $gen.accounts }}
  {{ .key }}: {{ .password | quote }}
  {{- end }}
{{- end }}
{{- if not .Values.dkim.existingSecret }}
---
{{/*
Kept even when Rspamd is off, so turning it back on later signs with the
key already published in DNS rather than a fresh one.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mailserver.dkimSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mailserver.labels" . | nindent 4 }}
  annotations:
    # Uninstalling must not take the published key with it.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  private.key: |
    {{- $gen.dkim | nindent 4 }}
{{- end }}

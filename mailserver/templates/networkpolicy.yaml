{{- if .Values.networkPolicy.enabled }}
{{/*
Admits only the published mail ports, from anywhere (IPv4 and IPv6).
Everything else the pod listens on - Rspamd's controller on 11334, its
Redis - stays unreachable even from inside the cluster.

Egress is not restricted: delivery needs outbound 25 to any mail server,
plus DNS and HTTPS for signature updates.

Has no effect with network.hostNetwork, which bypasses pod networking.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mailserver.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mailserver.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mailserver.serverSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        {{- range (include "mailserver.ports" . | fromJsonArray) }}
        - port: {{ .name }}
          protocol: TCP
        {{- end }}
{{- end }}

{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wazuh.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
type: Opaque
stringData:
  indexerUsername: {{ .Values.usernames.indexer | quote }}
  indexerPassword: {{ include "wazuh.gen" (dict "root" . "key" "indexerPassword") | quote }}
  dashboardUsername: {{ .Values.usernames.dashboard | quote }}
  dashboardPassword: {{ include "wazuh.gen" (dict "root" . "key" "dashboardPassword") | quote }}
  apiUsername: {{ .Values.usernames.api | quote }}
  apiPassword: {{ include "wazuh.gen" (dict "root" . "key" "apiPassword") | quote }}
  authdPass: {{ include "wazuh.gen" (dict "root" . "key" "authdPass") | quote }}
  clusterKey: {{ include "wazuh.gen" (dict "root" . "key" "clusterKey") | quote }}
  # bcrypt hashes for the indexer's internal user database. Stored rather
  # than recomputed, because bcrypt salts randomly and a fresh hash every
  # render would restart the indexer on every upgrade.
  indexerHash: {{ include "wazuh.gen" (dict "root" . "key" "indexerHash") | quote }}
  dashboardHash: {{ include "wazuh.gen" (dict "root" . "key" "dashboardHash") | quote }}
{{- end }}
{{- if not .Values.tls.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wazuh.certsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
  annotations:
    # Losing this while keeping the indexer volume locks the cluster out
    # of its own data.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  root-ca.pem: |
    {{- include "wazuh.cert" (dict "root" . "key" "ca") | nindent 4 }}
  # Same CA under the key Traefik's rootCAsSecrets looks for, so an
  # ingress can verify the dashboard's certificate rather than skipping
  # the check.
  ca.crt: |
    {{- include "wazuh.cert" (dict "root" . "key" "ca") | nindent 4 }}
  node.pem: |
    {{- include "wazuh.cert" (dict "root" . "key" "nodeCert") | nindent 4 }}
  node-key.pem: |
    {{- include "wazuh.cert" (dict "root" . "key" "nodeKey") | nindent 4 }}
  admin.pem: |
    {{- include "wazuh.cert" (dict "root" . "key" "adminCert") | nindent 4 }}
  admin-key.pem: |
    {{- include "wazuh.cert" (dict "root" . "key" "adminKey") | nindent 4 }}
  filebeat.pem: |
    {{- include "wazuh.cert" (dict "root" . "key" "filebeatCert") | nindent 4 }}
  filebeat-key.pem: |
    {{- include "wazuh.cert" (dict "root" . "key" "filebeatKey") | nindent 4 }}
  dashboard.pem: |
    {{- include "wazuh.cert" (dict "root" . "key" "dashboardCert") | nindent 4 }}
  dashboard-key.pem: |
    {{- include "wazuh.cert" (dict "root" . "key" "dashboardKey") | nindent 4 }}
{{- end }}

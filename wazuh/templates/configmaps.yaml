{{- $idx := include "wazuh.indexer.fullname" . -}}
{{- $certDir := "/usr/share/wazuh-indexer/config/certs" -}}
{{/*
opensearch.yml

The DNs here must match the certificates the chart generates. Sprig can
only set a Common Name, so these are bare CNs rather than the full
O/L/C subjects a hand-rolled PKI would use.
*/}}
{{- $seeds := list -}}
{{- range $i := until (int .Values.indexer.replicaCount) -}}
{{- $seeds = append $seeds (printf "%s-%d.%s" $idx $i $idx) -}}
{{- end -}}
{{- $initialMasters := list -}}
{{- range $i := until (int .Values.indexer.replicaCount) -}}
{{- $initialMasters = append $initialMasters (printf "%s-%d" $idx $i) -}}
{{- end -}}
{{- $os := dict
      "cluster.name" (include "wazuh.fullname" .)
      "network.host" "0.0.0.0"
      "path.data" "/var/lib/wazuh-indexer"
      "path.logs" "/var/log/wazuh-indexer"
      "discovery.seed_hosts" $seeds
      "cluster.initial_master_nodes" $initialMasters
      "plugins.security.ssl.http.enabled" true
      "plugins.security.ssl.http.pemcert_filepath" (printf "%s/node.pem" $certDir)
      "plugins.security.ssl.http.pemkey_filepath" (printf "%s/node-key.pem" $certDir)
      "plugins.security.ssl.http.pemtrustedcas_filepath" (printf "%s/root-ca.pem" $certDir)
      "plugins.security.ssl.transport.pemcert_filepath" (printf "%s/node.pem" $certDir)
      "plugins.security.ssl.transport.pemkey_filepath" (printf "%s/node-key.pem" $certDir)
      "plugins.security.ssl.transport.pemtrustedcas_filepath" (printf "%s/root-ca.pem" $certDir)
      "plugins.security.ssl.transport.enforce_hostname_verification" false
      "plugins.security.ssl.transport.resolve_hostname" false
      "plugins.security.authcz.admin_dn" (list "CN=admin")
      "plugins.security.nodes_dn" (list "CN=indexer")
      "plugins.security.allow_default_init_securityindex" true
      "plugins.security.restapi.roles_enabled" (list "all_access" "security_rest_api_access")
      "plugins.security.check_snapshot_restore_write_privileges" true
      "plugins.security.enable_snapshot_restore_privilege" true
      "compatibility.override_main_response_version" true
-}}
{{- $os = mergeOverwrite $os (deepCopy (.Values.indexer.extraConfig | default dict)) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $idx }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.componentLabels" (dict "root" . "component" "indexer") | nindent 4 }}
data:
  opensearch.yml: |
    {{- toYaml $os | nindent 4 }}
  internal_users.yml: |
    _meta:
      type: "internalusers"
      config_version: 2

    {{ .Values.usernames.indexer }}:
      hash: {{ include "wazuh.gen" (dict "root" . "key" "indexerHash") | quote }}
      reserved: true
      backend_roles:
        - "admin"
      description: "Wazuh indexer admin, generated by the Helm chart"

    {{ .Values.usernames.dashboard }}:
      hash: {{ include "wazuh.gen" (dict "root" . "key" "dashboardHash") | quote }}
      reserved: true
      description: "Account the Wazuh dashboard uses, generated by the Helm chart"
{{- if .Values.dashboard.enabled }}
{{- $osd := dict
      "server.host" "0.0.0.0"
      "server.port" 5601
      "opensearch.hosts" (include "wazuh.indexer.url" .)
      "opensearch.ssl.verificationMode" "certificate"
      "opensearch.ssl.certificateAuthorities" (list "/usr/share/wazuh-dashboard/certs/root-ca.pem")
      "opensearch.requestHeadersWhitelist" (list "authorization" "securitytenant")
      "opensearch_security.multitenancy.enabled" false
      "opensearch_security.readonly_mode.roles" (list "kibana_read_only")
      "server.ssl.enabled" true
      "server.ssl.key" "/usr/share/wazuh-dashboard/certs/key.pem"
      "server.ssl.certificate" "/usr/share/wazuh-dashboard/certs/cert.pem"
      "uiSettings.overrides.defaultRoute" "/app/wz-home"
-}}
{{- $osd = mergeOverwrite $osd (deepCopy (.Values.dashboard.extraConfig | default dict)) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wazuh.dashboard.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.componentLabels" (dict "root" . "component" "dashboard") | nindent 4 }}
data:
  opensearch_dashboards.yml: |
    {{- toYaml $osd | nindent 4 }}
{{- end }}
{{- if .Values.manager.config }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wazuh.fullname" . }}-manager-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.componentLabels" (dict "root" . "component" "manager") | nindent 4 }}
data:
  # Copied over the image's own ossec.conf at startup, not merged with it.
  master.conf: |
    {{- .Values.manager.config | nindent 4 }}
  worker.conf: |
    {{- (.Values.manager.workerConfig | default .Values.manager.config) | nindent 4 }}
{{- end }}

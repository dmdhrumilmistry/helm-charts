{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vk.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vk.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: http
      from:
        # The release namespace (helm tests).
        - podSelector: {}
        {{- range .Values.networkPolicy.allowNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        {{- if ne .Values.service.type "ClusterIP" }}
        # NodePort and LoadBalancer traffic arrives from outside the cluster.
        - ipBlock:
            cidr: 0.0.0.0/0
        {{- end }}
{{- end }}

{{- $r := .Values.sandboxes.registryCredentials }}
{{- if $r.create }}
{{- $user := required "sandboxes.registryCredentials.username is required when create is true" $r.username }}
{{- $pass := required "sandboxes.registryCredentials.password is required when create is true (an access token; pass it with --set or a values file kept out of git)" $r.password }}
# Registry credentials for sandbox images (for example a private macOS base
# image). The server lists this Secret in every sandbox's imagePullSecrets,
# and images/macos-base/snapshot.sh can push with it (PUSH_SECRET).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $r.name }}
  namespace: {{ include "vk.sandboxNamespace" . }}
  labels:
    {{- include "vk.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict $r.server (dict "username" $user "password" $pass "auth" (printf "%s:%s" $user $pass | b64enc))) | toJson | b64enc }}
{{- end }}

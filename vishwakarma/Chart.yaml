apiVersion: v2
name: vishwakarma
description: Self-hosted Vishwakarma - throwaway VMs and containers on Kubernetes for testing apps and endpoint tools, with a web console, browser terminal and automatic expiry.
type: application

# Chart version. Bump on every change to the chart or its templates.
version: 0.1.0

# Version of Vishwakarma this chart deploys by default.
appVersion: "0.1.0"

home: https://github.com/dmdhrumilmistry/vishwakarma
sources:
  - https://github.com/dmdhrumilmistry/vishwakarma
  - https://github.com/dmdhrumilmistry/helm-charts

keywords:
  - sandbox
  - virtual-machines
  - kubevirt
  - containers
  - testing
  - lab
  - endpoint-security

maintainers:
  - name: Dhrumil Mistry
    url: https://github.com/dmdhrumilmistry

annotations:
  # The chart is MIT; Vishwakarma itself is Apache-2.0.
  artifacthub.io/license: MIT
  artifacthub.io/images: |
    - name: vishwakarma
      image: ghcr.io/dmdhrumilmistry/vishwakarma:0.1.0
  artifacthub.io/links: |
    - name: Vishwakarma source (Apache-2.0)
      url: https://github.com/dmdhrumilmistry/vishwakarma
  artifacthub.io/changes: |
    - kind: added
      description: First release. Container sandboxes from templates or custom images, KubeVirt VMs, browser terminal and serial console, TTL expiry, per-sandbox NetworkPolicy isolation.

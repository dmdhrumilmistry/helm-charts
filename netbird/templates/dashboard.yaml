{{- if .Values.dashboard.enabled }}
{{- $fullName := include "netbird.dashboard.fullname" . -}}
{{- $labels := include "netbird.componentLabels" (dict "root" . "component" "dashboard") -}}
{{- $selector := include "netbird.componentSelectorLabels" (dict "root" . "component" "dashboard") -}}
{{- $publicURL := include "netbird.publicURL" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
data:
  # Browsers call these directly, so they must be the public URL rather
  # than an in-cluster Service name.
  NETBIRD_MGMT_API_ENDPOINT: {{ $publicURL | quote }}
  NETBIRD_MGMT_GRPC_API_ENDPOINT: {{ $publicURL | quote }}
  # OIDC against the server's embedded identity provider.
  AUTH_AUTHORITY: {{ printf "%s/oauth2" $publicURL | quote }}
  AUTH_CLIENT_ID: {{ .Values.dashboard.config.authClientId | quote }}
  AUTH_AUDIENCE: {{ .Values.dashboard.config.authAudience | quote }}
  AUTH_CLIENT_SECRET: {{ .Values.dashboard.config.authClientSecret | quote }}
  AUTH_SUPPORTED_SCOPES: {{ .Values.dashboard.config.authSupportedScopes | quote }}
  AUTH_REDIRECT_URI: "/nb-auth"
  AUTH_SILENT_REDIRECT_URI: "/nb-silent-auth"
  USE_AUTH0: {{ .Values.dashboard.config.useAuth0 | quote }}
  # TLS is terminated by the ingress controller, so the bundled nginx
  # serves plain HTTP and must not try to obtain its own certificate.
  NGINX_SSL_PORT: "443"
  LETSENCRYPT_DOMAIN: "none"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  {{- if not .Values.dashboard.autoscaling.enabled }}
  replicas: {{ .Values.dashboard.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $selector | nindent 8 }}
        {{- with .Values.dashboard.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ printf "%s|%s" $publicURL (toYaml .Values.dashboard.config) | sha256sum }}
        {{- with .Values.dashboard.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "netbird.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "netbird.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.dashboard.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.dashboard.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: {{ include "netbird.image" (dict "root" . "image" .Values.dashboard.image "defaultTag" .Values.dashboard.image.tag) }}
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ $fullName }}
          {{- with .Values.dashboard.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.dashboard.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.dashboard.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.dashboard.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.dashboard.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.dashboard.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.dashboard.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.dashboard.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.dashboard.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.dashboard.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.dashboard.readinessProbe.failureThreshold }}
          {{- end }}
          {{- with .Values.dashboard.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.dashboard.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.dashboard.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
  {{- with .Values.dashboard.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- $selector | nindent 4 }}
{{- end }}

apiVersion: v2
name: netbird
description: Self-hosted NetBird (WireGuard-based overlay network) with built-in local user management, PostgreSQL and zero external IdP required.
type: application

# Chart version. Bump on every change to the chart or its templates.
version: 1.0.0

# Version of NetBird that this chart deploys by default.
appVersion: "0.79.0"

icon: https://avatars.githubusercontent.com/u/100464677

home: https://netbird.io
sources:
  - https://github.com/netbirdio/netbird
  - https://github.com/dmdhrumilmistry/helm-charts

keywords:
  - netbird
  - wireguard
  - vpn
  - zero-trust
  - overlay-network
  - mesh

maintainers:
  - name: Dhrumil Mistry
    url: https://github.com/dmdhrumilmistry

annotations:
  artifacthub.io/license: MIT
  artifacthub.io/changes: |
    - kind: changed
      description: Rewritten around the combined netbirdio/netbird-server image (management + signal + relay + STUN in one workload).
    - kind: added
      description: Built-in local user management (embedded Dex IdP). No external OIDC provider required to install.
    - kind: added
      description: In-cluster PostgreSQL StatefulSet, enabled by default, with support for an external database.
    - kind: added
      description: Autoscaling (HPA), PodDisruptionBudgets, topology spread, resources and cloud presets for AWS EKS and GKE.
    - kind: removed
      description: Coturn, Adminer and the separate management/signal/relay Deployments. Their functionality now lives in netbird-server.

{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gitea.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitea.labels" . | nindent 4 }}
  annotations:
    # Losing secretKey makes every stored 2FA secret unreadable, so the
    # Secret outlives `helm uninstall` along with the data volumes.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := list "secretKey" "internalToken" "jwtSecret" "lfsJwtSecret" "metricsToken" "adminPassword" "postgresPassword" }}
  {{- if or (ne $key "postgresPassword") $.Values.postgresql.enabled }}
  {{ $key }}: {{ include "gitea.gen" (dict "root" $ "key" $key) | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if not .Values.postgresql.enabled }}
  postgresPassword: {{ required "externalDatabase.password (or existingSecret) is required when postgresql.enabled is false" .Values.externalDatabase.password | b64enc | quote }}
  {{- end }}
{{- end }}

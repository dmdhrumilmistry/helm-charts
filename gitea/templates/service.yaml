{{- $fullName := include "gitea.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitea.componentLabels" (dict "root" . "component" "server") | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "gitea.componentSelectorLabels" (dict "root" . "component" "server") | nindent 4 }}
{{- if .Values.ssh.enabled }}
{{- $ssh := .Values.ssh.service }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-ssh" $fullName | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitea.componentLabels" (dict "root" . "component" "server") | nindent 4 }}
  {{- with $ssh.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $ssh.type }}
  {{- if and $ssh.externalTrafficPolicy (ne $ssh.type "ClusterIP") }}
  externalTrafficPolicy: {{ $ssh.externalTrafficPolicy }}
  {{- end }}
  {{- with $ssh.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with $ssh.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - name: ssh
      port: {{ $ssh.port }}
      targetPort: ssh
      protocol: TCP
  selector:
    {{- include "gitea.componentSelectorLabels" (dict "root" . "component" "server") | nindent 4 }}
{{- end }}
